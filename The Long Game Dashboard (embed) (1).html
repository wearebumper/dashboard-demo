  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

isplay: swap;\n  src: url(\"71b0ab4b-3cc6-4ba0-ba5a-9d30851db800\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"f5dca897-3bbc-45d0-a430-51fd516e7918\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"71b0ab4b-3cc6-4ba0-ba5a-9d30851db800\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f5dca897-3bbc-45d0-a430-51fd516e7918\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"71b0ab4b-3cc6-4ba0-ba5a-9d30851db800\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ---------------------------------------------------------------------------\n   Bumper — Colour tokens\n   Two layers:\n   1. BASE palette — raw, named values. Brand-book colours + the product\n      (Dashboard) Tailwind scales as shipped in dash.podcastxray.com.\n   2. SEMANTIC aliases — what you actually reach for when building UI.\n--------------------------------------------------------------------------- */\n:root {\n  /* === BRAND (Brand Standard Guidelines v1, July 2022) ============= */\n  --brand-phthalo-blue: #03178c; /* PMS Reflex Blue C — primary */\n  --brand-macaroni: #ffb685;     /* PMS 7410 C — \"Macaroni & Cheese\", secondary */\n  --brand-seashell: #fff7f1;     /* warm off-white, secondary */\n  --brand-black: #000000;\n  --brand-white: #ffffff;\n\n  /* === PRODUCT BLUE (Dashboard primary scale) ====================== */\n  --blue-50:  #d1e5ff;\n  --blue-100: #bdd8ff;\n  --blue-200: #9ec8ff;\n  --blue-300: #87b5ff;\n  --blue-400: #7099f3;\n  --blue-500: #5572de;\n  --blue-600: #3957c6;\n  --blue-700: #2033ae; /* --ui-primary: default interactive blue */\n  --blue-800: #122499;\n  --blue-900: #061786; /* navigation bar, dark panels */\n  --blue-950: #052561;\n\n  /* === NEUTRALS (gray) ============================================= */\n  --gray-50:  #f9fafb;\n  --gray-100: #f3f4f6;\n  --gray-200: #e5e7eb;\n  --gray-300: #d1d5db;\n  --gray-400: #9ca3af;\n  --gray-500: #6b7280;\n  --gray-600: #4b5563;\n  --gray-700: #374151;\n  --gray-800: #1f2937;\n  --gray-900: #111827;\n  --gray-950: #030712;\n\n  /* === GREEN (success / positive delta) ============================ */\n  --green-50:  #f0fdf4;\n  --green-100: #dcfce7;\n  --green-400: #4ade80;\n  --green-500: #22c55e;\n  --green-600: #16a34a;\n  --green-700: #15803d;\n  --green-800: #166534;\n\n  /* === RED (error / destructive / negative) ======================== */\n  --red-50:  #fef2f2;\n  --red-100: #fee2e2;\n  --red-300: #fca5a5;\n  --red-400: #f87171;\n  --red-500: #ef4444;\n  --red-600: #dc2626;\n  --red-700: #b91c1c;\n  --red-900: #7f1d1d;\n\n  /* === YELLOW (beta / caution badges) ============================== */\n  --yellow-50:  #fefce8;\n  --yellow-100: #fef9c3;\n  --yellow-300: #fde047;\n  --yellow-400: #facc15;\n  --yellow-500: #eab308;\n  --yellow-700: #a16207;\n  --yellow-800: #854d0e;\n\n  /* === PLATFORM brand colours (used in charts + platform chips) ==== */\n  --platform-spotify: #1ed760;\n  --platform-apple:   #7d50df; /* apple-950 in product theme */\n  --platform-youtube: #ff0000;\n\n  /* === SEMANTIC ALIASES =========================================== */\n  /* Text */\n  --text-strong:  var(--gray-900);\n  --text-body:    var(--gray-700);\n  --text-muted:   var(--gray-500);\n  --text-subtle:  var(--gray-400);\n  --text-inverse: var(--brand-white);\n  --text-link:    var(--blue-700);\n  --text-link-hover:  var(--blue-500);\n  --text-link-active: var(--blue-900);\n\n  /* Surfaces */\n  --surface-page:    var(--gray-100);\n  --surface-card:    var(--brand-white);\n  --surface-sunken:  var(--gray-50);\n  --surface-nav:     var(--blue-900);\n  --surface-nav-active: var(--blue-700);\n  --surface-inverse: var(--blue-900);\n\n  /* Borders */\n  --border-subtle: var(--gray-900); /* used at low opacity, e.g. /10 */\n  --border-default: var(--gray-200);\n  --border-strong:  var(--gray-300);\n\n  /* Interactive / primary */\n  --primary:        var(--blue-700);\n  --primary-hover:  var(--blue-800);\n  --primary-active: var(--blue-900);\n  --primary-contrast: var(--brand-white);\n  --focus-ring:     var(--blue-700);\n\n  /* Status */\n  --success:        var(--green-600);\n  --success-soft:   var(--green-100);\n  --success-text:   var(--green-800);\n  --danger:         var(--red-600);\n  --danger-soft:    var(--red-100);\n  --danger-text:    var(--red-700);\n  --warning:        var(--yellow-400);\n  --warning-soft:   var(--yellow-100);\n  --warning-text:   var(--yellow-800);\n  --info:           var(--blue-700);\n  --info-soft:      var(--blue-50);\n\n  /* Up / down delta indicators */\n  --delta-up-bg:   var(--green-100);\n  --delta-up-fg:   var(--green-600);\n  --delta-down-bg: var(--gray-100);\n  --delta-down-fg: var(--gray-600);\n\n  /* Bumper Score gradient (0 → 200, 100 = average) */\n  --score-gradient: linear-gradient(to right, var(--blue-400), var(--green-600));\n}\n\n/* ---------------------------------------------------------------------------\n   Bumper — Typography tokens\n   Typeface: DM Sans (display + body). Scale and weights mirror the Dashboard,\n   which leans on Tailwind's type ramp. Numbers/metrics are set bold with\n   tight tracking; body copy stays regular.\n--------------------------------------------------------------------------- */\n:root {\n  /* Families */\n  --font-sans:    \"DM Sans\", ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-display: \"DM Sans\", ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-mono:    ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-bold:    700;\n\n  /* Type scale (rem, 16px base) */\n  --text-xs:   0.75rem;   /* 12px — badges, captions, axis labels */\n  --text-sm:   0.875rem;  /* 14px — table cells, secondary copy   */\n  --text-base: 1rem;      /* 16px — body                          */\n  --text-md:   1.0625rem; /* 17px — card titles                   */\n  --text-lg:   1.125rem;  /* 18px — section labels                */\n  --text-xl:   1.25rem;   /* 20px                                 */\n  --text-2xl:  1.5rem;    /* 24px — page H2 / \"Sign in\"           */\n  --text-3xl:  1.875rem;  /* 30px — hero metrics                  */\n  --text-4xl:  2.25rem;   /* 36px — page H1 on marketing          */\n  --text-5xl:  3rem;      /* 48px — large display                 */\n\n  /* Line heights */\n  --leading-tight:  1.1;\n  --leading-snug:   1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tight:  -0.02em; /* hero numbers, large headings */\n  --tracking-normal: 0;\n  --tracking-wide:   0.02em;\n}\n\n/* ---------------------------------------------------------------------------\n   Bumper — Spacing, radius, shadow & layout tokens\n   The Dashboard is built on Tailwind's 4px spacing grid. Cards are lightly\n   rounded (rounded-lg) with a hairline gray border and a soft shadow.\n--------------------------------------------------------------------------- */\n:root {\n  /* Spacing scale (4px grid) */\n  --space-0:  0;\n  --space-1:  0.25rem;  /* 4  */\n  --space-2:  0.5rem;   /* 8  */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.25rem;  /* 20 */\n  --space-6:  1.5rem;   /* 24 */\n  --space-8:  2rem;     /* 32 */\n  --space-10: 2.5rem;   /* 40 */\n  --space-12: 3rem;     /* 48 */\n  --space-16: 4rem;     /* 64 */\n\n  /* Radii */\n  --radius-xs:   0.125rem; /* 2px  — platform chips        */\n  --radius-sm:   0.25rem;  /* 4px  — small controls        */\n  --radius-md:   0.375rem; /* 6px  — buttons, inputs       */\n  --radius-lg:   0.5rem;   /* 8px  — cards, panels, tables */\n  --radius-xl:   0.75rem;  /* 12px — modals                */\n  --radius-full: 9999px;   /* pills, avatars, score bar    */\n\n  /* Shadows (soft, low-contrast — Bumper UI is flat-leaning) */\n  --shadow-xs: 0 1px 2px 0 rgba(17, 24, 39, 0.05);\n  --shadow-sm: 0 1px 3px 0 rgba(17, 24, 39, 0.08), 0 1px 2px -1px rgba(17, 24, 39, 0.06);\n  --shadow-md: 0 4px 6px -1px rgba(17, 24, 39, 0.08), 0 2px 4px -2px rgba(17, 24, 39, 0.06);\n  --shadow-lg: 0 10px 15px -3px rgba(17, 24, 39, 0.10), 0 4px 6px -4px rgba(17, 24, 39, 0.05);\n\n  /* Layout */\n  --nav-height: 4rem;     /* 64px header bar */\n  --content-max: 80rem;   /* page gutter container */\n\n  /* Motion */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n}\n\n/* ---------------------------------------------------------------------------\n   Bumper — Base element styles\n   A light reset + brand defaults so plain HTML inherits the Bumper look.\n--------------------------------------------------------------------------- */\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n  /* Tailwind v4 default border colour compat used across the Dashboard */\n  border-color: var(--border-default);\n}\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n  font-family: var(--font-sans);\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  margin: 0;\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold);\n  color: var(--text-strong);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n}\n\np { margin: 0; }\n\na {\n  color: var(--text-link);\n  font-weight: var(--weight-medium);\n  text-decoration: none;\n  transition: color var(--duration-fast) var(--ease-standard);\n}\na:hover { color: var(--text-link-hover); }\n\nimg, svg { display: block; max-width: 100%; }\n\n:focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 2px;\n}\n\n::selection {\n  background: var(--blue-100);\n  color: var(--blue-900);\n}\n\n<\u002Fstyle>\n  <script src=\"021e98d8-82c1-4232-bd81-c248d3b7c2b3\"><\u002Fscript>\n  <style>\n    *{box-sizing:border-box}\n    body{margin:0;background:var(--surface-page)}\n    .bmp-menu-item:hover{background:var(--gray-50)}\n\n    /* ---- Responsive (mobile) ---- */\n    @media (max-width:900px){\n      .kpi-grid{grid-template-columns:repeat(2,1fr)!important}\n      .kpi-grid>div{border-right:1px solid var(--border-default)}\n      .kpi-grid>div:nth-child(2n){border-right:none}\n      .kpi-grid>div:nth-child(n+3){border-top:1px solid var(--border-default)}\n    }\n    @media (max-width:560px){\n      .kpi-grid{gr
